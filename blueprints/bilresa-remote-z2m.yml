blueprint:
  name: Zigbee2MQTT – IKEA BILRESA Remote (Directional Dimmer)
  description: >
    Control light groups with an IKEA BILRESA remote via Zigbee2MQTT.
    - Single click toggles primary lights
    - Double click toggles secondary lights
    - Rotary wheel dims or brightens selected dimmer lights
  domain: automation
  input:
    remote_topic:
      name: Zigbee2MQTT topic
      description: "Example: zigbee2mqtt/bilreasa_salon"
      selector:
        text:

    primary_lights:
      name: Primary light(s)
      description: Toggled by single click
      selector:
        target:
          entity:
            domain: light

    secondary_lights:
      name: Secondary light(s)
      description: Toggled by double click
      default: {}
      selector:
        target:
          entity:
            domain: light

    dimmer_lights:
      name: Dimmer light(s)
      description: Controlled by rotary wheel
      selector:
        target:
          entity:
            domain: light

    wheel_memory:
      name: Wheel memory helper
      description: Input number storing last wheel level
      selector:
        entity:
          domain: input_number

    dim_step:
      name: Dimming step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"

trigger:
  - platform: mqtt
    topic: !input remote_topic

action:
  # ─────────────────────────────
  # Make blueprint inputs usable in templates
  # ─────────────────────────────
  - variables:
      action: "{{ trigger.payload_json.action | default('') }}"
      new_level: "{{ trigger.payload_json.action_level | default(None) }}"
      wheel_memory_entity: !input wheel_memory
      last_level: "{{ states(wheel_memory_entity) | int(0) }}"

  - choose:
      # Single click → toggle primary lights
      - conditions:
          - condition: template
            value_template: "{{ action in ['on', 'off'] }}"
        sequence:
          - service: light.toggle
            target: !input primary_lights

      # Double click → toggle secondary lights
      - conditions:
          - condition: template
            value_template: "{{ action == 'on_double' }}"
        sequence:
          - service: light.toggle
            target: !input secondary_lights

      # Rotary wheel → direction-aware dimming
      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_move_to_level' }}"
        sequence:
          - variables:
              last: "{{ states(!input wheel_memory) | int(0) }}"
              step: >
                {% set d = !input dim_step | int %}
                {% if new_level is none %}
                  {{ d }}
                {% elif new_level == 1 %}
                  {{ -d }}
                {% elif new_level > last %}
                  {{ d }}
                {% elif new_level < last %}
                  {{ -d }}
                {% else %}
                  0
                {% endif %}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ step | int(0) != 0 }}"
                sequence:
                  - service: light.turn_on
                    target: !input dimmer_lights
                    data:
                      brightness_step_pct: "{{ step | int(0) }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ new_level is not none }}"
                sequence:
                  - service: input_number.set_value
                    target:
                      entity_id: !input wheel_memory
                    data:
                      value: "{{ new_level | int(0) }}"

mode: restart
